async function api(path, opt={}){
  const r = await fetch(SUPA_URL+path,{headers:{...H,...(opt.prefer?{Prefer:opt.prefer}:{})},method:opt.method||"GET",body:opt.body?JSON.stringify(opt.body):undefined});
  const txt = await r.text(); let data; try{data = txt?JSON.parse(txt):null}catch{data = txt}
  if(!r.ok) throw {status:r.status,data};
  return data;
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3200)}
const G = () => ({vou:players.filter(p=>p.status==="vou"),talvez:players.filter(p=>p.status==="talvez"),nao:players.filter(p=>p.status==="nao"),espera:players.filter(p=>p.status==="espera")});

async function load(){
  try{
    const m = await api("/matches?active=eq.true&order=id.desc&limit=1");
    match = m[0]||null;
    players = match ? await api(`/players?match_id=eq.${match.id}&order=created_at.asc,id.asc`) : [];
    if(match && !busyW){ try{ const r=await api(`/sorteio?match_id=eq.${match.id}`); const ns=r[0]?r[0].state:{}; lock=r[0]&&r[0].lock_until?{by:r[0].lock_by,until:Date.parse(r[0].lock_until)}:{by:null,until:0};
      if(seenV!==null&&ns.v&&ns.v!==seenV&&ns.teams) toast("⚽ TIMES DEFINIDOS!");
      seenV=ns.v||0; sorteio=ns; sorteioErr=false }catch{ sorteioErr=true } }
    syncClock();
    const vouNow = players.filter(p=>p.status==="vou");
    if(known){ const nw=vouNow.filter(p=>!known.has(p.id)&&p.device_id!==device);
      if(nw.length){ toast("🔥 Novo jogador confirmado!"); nw.forEach(p=>{fresh[p.id]=Date.now()+6000;goal(p.name)}); setTimeout(()=>{if(!editing)render()},6100) } }
    known = new Set(vouNow.map(p=>p.id));
    if(msg.c==="err"&&msg.t.startsWith("Sem conexão")) msg={t:"",c:""};
  }catch(e){ msg = {t:"Sem conexão com o banco. Verifique o setup.",c:"err"}; lastSig="" }
  const sig = JSON.stringify([match,players,msg,Object.keys(fresh).length,sorteio,sorteioErr,isAdmin,lockedOther()]);
  if(!editing && sig!==lastSig){ lastSig=sig; render(); }
}
async function loadHist(){
  try{
    const ms = await api("/matches?active=eq.false&order=id.desc&limit=8");
    if(!ms.length){hist=[];return}
    const ps = await api(`/players?select=match_id&status=eq.vou&match_id=in.(${ms.map(m=>m.id).join(",")})`);
    hist = ms.map(m=>({date:m.date,n:ps.filter(p=>p.match_id===m.id).length}));
  }catch{}
}

async function insertPlayer(name,status){
  return api("/players",{method:"POST",body:{match_id:match.id,name,name_key:norm(name),device_id:device,status}});
}
async function confirmar(status){
  const name=$("#nome").value.trim().replace(/\s+/g," ");
  if(name.length<2){ msg={t:"Digite seu nome.",c:"err"}; return render(); }
  if(players.some(p=>p.name_key===norm(name))){ msg={t:"Esse nome já está confirmado.",c:"err"}; return render(); }
  if(status==="vou" && G().vou.length>=match.max_players) status="espera";
  document.querySelectorAll("#app button").forEach(b=>b.disabled=true);
  try{
    try{ await insertPlayer(name,status) }
    catch(e){ if(status==="vou"&&JSON.stringify(e.data||"").includes("LOTADO")){status="espera";await insertPlayer(name,status)} else throw e }
    msg={t:"",c:""}; if(status==="vou") goal(name); else toast(status==="espera"?"⏳ Você entrou na lista de espera":status==="talvez"?"🟡 Marcado como talvez":"🔴 Marcado como não vou");
  }catch(e){
    const s=JSON.stringify(e.data||"");
    msg = e.status===409 ? {t:"Esse nome já está confirmado.",c:"err"} : s.includes("FECHADO") ? {t:"Confirmações encerradas.",c:"err"} : {t:"Erro ao confirmar. Tente de novo.",c:"err"};
  }
  await load(); lastSig=""; render();
}
async function setStatus(s){
  const mine=players.find(p=>p.device_id===device); if(!mine||mine.status===s) return;
  if(s==="vou" && G().vou.length>=match.max_players) s="espera";
  try{ await api(`/players?id=eq.${mine.id}&device_id=eq.${encodeURIComponent(device)}`,{method:"PATCH",body:{status:s}}); msg={t:"",c:""}; if(s==="vou") goal(mine.name); else toast(s==="espera"?"⏳ Lista de espera":s==="talvez"?"🟡 Talvez":"🔴 Não vou") }
  catch(e){ msg=JSON.stringify(e.data||"").includes("FECHADO")?{t:"Confirmações encerradas.",c:"err"}:{t:"Não foi possível alterar. Tente de novo.",c:"err"} }
  await load(); lastSig=""; render();
}
async function cancelar(id){
  try{ await api(`/players?id=eq.${id}&device_id=eq.${encodeURIComponent(device)}`,{method:"DELETE"}); msg={t:"Presença cancelada.",c:"good"} }
  catch{ msg={t:"Erro ao cancelar.",c:"err"} }
  await load(); lastSig=""; render();
}

const NET=(()=>{let t="";for(let x=26;x<=134;x+=12)t+=`<line x1="${x}" y1="18" x2="${x}" y2="102"/>`;for(let y=30;y<=90;y+=12)t+=`<line x1="14" y1="${y}" x2="146" y2="${y}"/>`;return t})();
const BALL=`<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#fff" stroke="#111" stroke-width="2.5"/><polygon points="20,11 28,17 25,27 15,27 12,17" fill="#111"/><path d="M20 11V2M28 17l9-3M25 27l6 8M15 27l-6 8M12 17l-9-3" stroke="#111" stroke-width="2" fill="none"/></svg>`;
function goalHTML(name){

function goal(name){ if(gq.length<3) gq.push(name); if(!gBusy) nextGoal() }
function nextGoal(){
  const name=gq.shift(), el=$("#goal");
  if(!name){ gBusy=false; return }
  gBusy=true; el.innerHTML=goalHTML(name);
  if(!reduce){
    const r=el.querySelector(".ggoal").getBoundingClientRect(), b=el.querySelector(".gball");
    b.style.setProperty("--gx",(r.left+r.width/2)+"px"); b.style.setProperty("--gy",(r.top+r.height*.6)+"px"); b.style.setProperty("--sy",(innerHeight*.62)+"px");
    setTimeout(playGol,1250);
  } else playGol();
  setTimeout(()=>{ el.innerHTML=""; nextGoal() }, reduce?2400:4900);
}

const sndLabel=()=>{$("#sndLink").textContent=soundOn?"🔊 som":"🔇 som"};
function unlock(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==="suspended") actx.resume() }catch{} }
$("#sndLink").onclick=()=>{ soundOn=!soundOn; localStorage.setItem("fdc_som",soundOn?"1":"0"); sndLabel(); if(soundOn){ unlock(); setTimeout(playGol,100) } };

function playGol(){
  if(!soundOn||!actx||actx.state!=="running") return;
  try{
    const t=actx.currentTime, len=actx.sampleRate*1.6, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=actx.createBufferSource(); src.buffer=buf;
    const f=actx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=.7;
    const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.35); g.gain.linearRampToValueAtTime(0,t+1.6);
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t);
    const o=actx.createOscillator(), og=actx.createGain(); o.type="square";
    o.frequency.setValueAtTime(520,t+.05); o.frequency.linearRampToValueAtTime(700,t+.4);
    og.gain.setValueAtTime(.05,t+.05); og.gain.linearRampToValueAtTime(0,t+.5);
    o.connect(og); og.connect(actx.destination); o.start(t+.05); o.stop(t+.55);
  }catch{}
}

let tab="presenca", sorteio={}, sorteioErr=false, seenV=null, off=0, lastSync=0, endKey=null, busyW=false, sz=5, mode="igual", src="conf", manSel=null, fin=false, loginTimes=false, lock={by:null,until:0}, sorting=false, confRst=false;
const TM=[{e:"🟢",c:"#22c55e",t:"#04180a"},{e:"⚫",c:"#0a0a0a",t:"#fff"},{e:"🔵",c:"#3b82f6",t:"#fff"},{e:"🟠",c:"#f97316",t:"#1a0a00"},{e:"🟡",c:"#facc15",t:"#1a1500"},{e:"🔴",c:"#ef4444",t:"#fff"}];
const tm=i=>TM[i%TM.length];
const pill=i=>`<span class="tpill" style="background:${tm(i).c};color:${tm(i).t}">${tm(i).e} TIME ${i+1}</span>`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>{const u=new Uint32Array(1);crypto.getRandomValues(u);return u[0]%n};
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
const serverNow=()=>Date.now()+off;
async function syncClock(){ if(Date.now()-lastSync<20000)return; lastSync=Date.now(); try{const t0=Date.now();const ms=await api("/rpc/server_ms",{method:"POST",body:{}});off=ms-(t0+Date.now())/2}catch{} }

const TT=()=>sorteio.timer||{dur:600,status:"idle",used:0};
const remMs=()=>{const t=TT();return t.dur*1000-(t.used||0)-(t.status==="running"?serverNow()-t.startedAt:0)};
function effSt(){const t=TT();if(t.status==="idle")return"idle";return remMs()<=0?"done":t.status}
const fmtClk=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const LBL={idle:"Aguardando início",running:"⚽ PARTIDA EM ANDAMENTO",paused:"⏸ PARTIDA PAUSADA",done:"🏁 TEMPO ESGOTADO!"};
const lockedOther=()=>lock.until>serverNow()&&lock.by!==device;
function tick(){
  const st=effSt(), rem=remMs(), txt=fmtClk(rem), t=TT();
  const c=$("#clk"); if(c){c.textContent=txt;c.className="clk "+st+(st==="running"&&rem<60000?" low":"")}
  const cc=$("#clkc"); if(cc) cc.className="card clkc "+st;
  const cb=$("#cbari"); if(cb) cb.style.width=Math.max(0,Math.min(100,rem/(t.dur*10)))+"%";
  const l=$("#cls"); if(l) l.textContent=LBL[st];
  const show=!!match&&st!=="idle"&&tab!=="times", b=$("#tbar");
  document.body.classList.toggle("hasbar",show);
  if(b){b.style.display=show?"flex":"none"; if(show) b.innerHTML=`<span>${st==="done"?"🏁 TEMPO ESGOTADO":st==="paused"?"⏸ PARTIDA PAUSADA":"⚽ PARTIDA EM ANDAMENTO"}</span><b>${txt}</b>`}
  const k=t.rid||t.startedAt||0;
  if(st==="done"&&endKey!==k){ endKey=k; if(rem>-8000) showFim(); if(!editing){lastSig="";render()} }
}
setInterval(tick,250);
function closeFim(){$("#fim").innerHTML=""}
function showFim(){
  const e=$("#fim"), balls=[8,24,40,58,74,90].map((x,i)=>`<i style="--x:${x}vw;--s:${34+i%3*14}px;--d:${2.6+i*.4}s;--dl:${-i*.5}s">⚽</i>`).join("");
  e.innerHTML=`<div class="fx" onclick="closeFim()">${balls}<h1 class="fx1">ACABOUUUUUUU! 🔥</h1><h2 class="fx2">⏰ TEMPO ESGOTADO!</h2><small>toque para fechar</small></div>`;
  clearTimeout(showFim.t); showFim.t=setTimeout(closeFim,reduce?3000:6200);
  if(!reduce&&navigator.vibrate) try{navigator.vibrate([250,100,250,100,500])}catch{}
  playFim();
}
function playFim(){ if(!soundOn||!actx||actx.state!=="running")return; try{const t=actx.currentTime;[0,.4,.8].forEach((d,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="square";o.frequency.value=i==2?1100:880;g.gain.setValueAtTime(.07,t+d);g.gain.linearRampToValueAtTime(0,t+d+(i==2?1:.3));o.connect(g);g.connect(actx.destination);o.start(t+d);o.stop(t+d+1.05)})}catch{} }
function setTab(t){tab=t;lastSig="";render();tick();scrollTo(0,0)}

async function save(patch,bump){
  busyW=true; if(bump){patch={...patch,v:Date.now()};seenV=patch.v}
  sorteio={...sorteio,...patch}; lastSig="";render();tick();
  try{ await api("/rpc/patch_sorteio",{method:"POST",body:{p_match:match.id,p_patch:patch}}) }
  catch{ toast("⚠️ Erro ao salvar. Rodou o SQL supabase-times-v2?") }
  busyW=false;
}
/* cronômetro (público) */
const rid=()=>Math.random().toString(36).slice(2,10);
function timerStart(){const t=TT(), fresh=t.status!=="paused"||effSt()==="done";save({timer:{dur:t.dur,status:"running",used:fresh?0:(t.used||0),startedAt:serverNow(),rid:fresh?rid():t.rid}})}
function timerPause(){const t=TT();save({timer:{...t,status:"paused",used:(t.used||0)+serverNow()-t.startedAt}})}
function timerReset(){confRst=false;save({timer:{dur:TT().dur,status:"idle",used:0,rid:null}})}
function setDur(v){let d; if(v==="c"){const m=parseFloat(String(prompt("Duração em minutos? (ex.: 8, 17, 25)","10")).replace(",","."));if(!m||m<=0||m>180){render();return}d=Math.round(m*60)}else d=Math.round(+v*60); save({timer:{dur:d,status:"idle",used:0,rid:null}})}

/* sorteio */
function makeTeams(names,size,md){
  const a=shuffle([...names]); let k=Math.floor(a.length/size), teams=[], res=[];
  if(k<2){k=2;md="equil"}
  if(md==="igual"){for(let i=0;i<k;i++)teams.push(a.splice(0,size));res=a}
  else{teams=Array.from({length:k},()=>[]);a.forEach((n,i)=>teams[i%k].push(n))}
  return {teams:teams.map(p=>({players:p})),reserves:res};
}
async function sortear(){
  if(sorting||lockedOther()) return;
  const vou=G().vou, pool=src==="conf"?vou:vou.filter(p=>manSel&&manSel.has(p.id));
  if(pool.length<2) return toast("Selecione pelo menos 2 jogadores");
  if((sorteio.teams||[]).length && !confirm("Os times atuais serão substituídos. Deseja sortear novamente?")) return;
  sorting=true;
  try{ const ok=await api("/rpc/try_lock_sorteio",{method:"POST",body:{p_match:match.id,p_by:device,p_secs:15}});
    if(ok===false){ sorting=false; toast("🎲 Outra pessoa já está sorteando"); return load() } }catch{}
  const names=pool.map(p=>p.name), box=$("#shuf");
  box.innerHTML=`<div class="shb"><b>🎲 EMBARALHANDO...</b><span id="shn"></span></div>`;
  const iv=setInterval(()=>{const e=$("#shn");if(e)e.textContent=names[rnd(names.length)]},80);
  const r=makeTeams(names,sz,mode);
  await sleep(reduce?300:1900); clearInterval(iv);
  box.innerHTML=`<div class="shb"><b>⚽ TIMES DEFINIDOS!</b></div>`; fin=false;
  await save({size:sz,teams:r.teams,reserves:r.reserves,cur:[0,1],queue:r.teams.slice(2).map((_,i)=>i+2),timer:{dur:TT().dur,status:"idle",used:0,rid:null}},true);
  await sleep(1100); box.innerHTML="";
  try{ await api(`/sorteio?match_id=eq.${match.id}&lock_by=eq.${encodeURIComponent(device)}`,{method:"PATCH",body:{lock_until:null}}) }catch{}
  sorting=false; lock={by:null,until:0}; lastSig=""; render();
}
function mover(from,i,dest){
  if(dest==="")return;
  const teams=JSON.parse(JSON.stringify(sorteio.teams||[])), res=[...(sorteio.reserves||[])];
  const arr=from==="r"?res:teams[+from].players, n=arr.splice(i,1)[0];
  (dest==="r"?res:teams[+dest].players).push(n);
  save({teams,reserves:res});
}
function finalizar(stay){
  const s=sorteio, cur=s.cur||[0,1], q=[...(s.queue||[])];
  const out=stay==null?[...cur]:cur.filter(x=>x!==stay), keep=stay==null?[]:[stay];
  while(keep.length<2&&q.length)keep.push(q.shift());
  q.push(...out);
  while(keep.length<2&&q.length)keep.push(q.shift());
  const t=TT(); fin=false;
  save({cur:keep,queue:q,hist:[...(s.hist||[]),{a:cur[0],b:cur[1],dur:t.dur}],timer:{dur:t.dur,status:"idle",used:0}});
}
function togSel(id,c){c?manSel.add(id):manSel.delete(id);render()}

function tabsHTML(){return `<div class="tabs"><button class="${tab==="presenca"?"on":""}" onclick="setTab('presenca')">📋 Presença</button><button class="${tab==="times"?"on":""}" onclick="setTab('times')">⚽ Sortear Times</button></div>`}
function clkCard(){
  const t=TT(), st=effSt(), cm=t.dur/60, durs=[5,7,10,12,15,20];
  const opts=durs.map(m=>`<option value="${m}" ${m===cm?"selected":""}>${m} minutos</option>`).join("")+(durs.includes(cm)?"":`<option value="${cm}" selected>${+cm.toFixed(1)} minutos</option>`)+`<option value="c">✏️ Personalizado…</option>`;
  const run=t.status==="running"&&st!=="done";
  return `<div id="clkc" class="card clkc ${st}"><div class="tag">⏱️ Cronômetro</div><div id="clk" class="clk ${st}">${fmtClk(remMs())}</div><div class="cbar"><i id="cbari"></i></div><div id="cls" class="cls">${LBL[st]}</div>
  ${confRst?`<div class="in y"><b>Reiniciar o cronômetro?</b></div><div class="two"><button class="danger" onclick="timerReset()">SIM, REINICIAR</button><button class="ghost" onclick="confRst=false;render()">CANCELAR</button></div>`
  :`<div class="two" style="margin-top:0"><button onclick="${run?"timerPause()":"timerStart()"}">${run?"⏸ PAUSAR":t.status==="paused"&&st!=="done"?"▶ CONTINUAR":"▶ INICIAR"}</button><button class="ghost" onclick="confRst=true;render()">🔄 REINICIAR</button></div>
  <label style="margin-top:14px;text-align:left">Duração da partida</label><select onchange="setDur(this.value)">${opts}</select>`}
  <div class="hint" style="margin:6px 0 0">Sincronizado para todos 📡</div></div>`;
}
function previewTxt(n){
  if(n<2) return "Selecione pelo menos 2 jogadores.";
  let k=Math.floor(n/sz), md=mode; if(k<2){k=2;md="equil"}
  if(md==="igual") return `${k} times de ${sz}`+(n-k*sz?` + ${n-k*sz} reserva(s)`:"");
  const b=Math.floor(n/k), x=n%k; return `${k} times equilibrados (${x?`${x}× ${b+1} e ${k-x}× ${b}`:`${b} cada`})`;
}
function setupCard(g){
  const vou=g.vou; if(manSel===null) manSel=new Set(vou.map(p=>p.id));
  const pool=src==="conf"?vou:vou.filter(p=>manSel.has(p.id));
  return `<div class="card"><div class="tag">🎲 Sorteio</div>
  <label>👥 Quantos jogadores por time?</label><select onchange="sz=+this.value;render()">${[3,4,5,6,7,8,9,10,11].map(n=>`<option value="${n}" ${n===sz?"selected":""}>${n} jogadores</option>`).join("")}</select>
  <label>De onde vêm os jogadores</label><div class="seg2"><button class="${src==="conf"?"on":""}" onclick="src='conf';render()">🟢 Confirmados (${vou.length})</button><button class="${src==="man"?"on":""}" onclick="src='man';render()">✏️ Escolher</button></div>
  ${src==="man"?`<div class="cks">${vou.map(p=>`<label class="ck"><input type="checkbox" ${manSel.has(p.id)?"checked":""} onchange="togSel(${p.id},this.checked)"><span>${esc(p.name)}</span></label>`).join("")||'<div class="empty">Ninguém confirmado.</div>'}</div>`:""}
  <label>Como dividir</label><div class="seg2"><button class="${mode==="igual"?"on":""}" onclick="mode='igual';render()">Iguais + reservas</button><button class="${mode==="equil"?"on":""}" onclick="mode='equil';render()">Equilibrado</button></div>
  <div class="hint" style="margin:0 0 12px"><b>${pool.length}</b> jogadores ${src==="conf"?"confirmados":"selecionados"} · ${previewTxt(pool.length)}</div>
  ${lockedOther()?`<div class="hint" style="margin:0 0 10px">🎲 Sorteio sendo realizado...</div>`:""}<button class="big" onclick="sortear()" ${lockedOther()||sorting?"disabled":""}>🎲 SORTEAR TIMES</button></div>`;
}
const mvSel=(k,j,nt)=>`<select class="mv" onchange="mover('${k}',${j},this.value)"><option value="">↔ mover</option>${Array.from({length:nt},(_,x)=>x).filter(x=>x!==k).map(x=>`<option value="${x}">${tm(x).e} Time ${x+1}</option>`).join("")}${k==="r"?"":`<option value="r">🔄 Reservas</option>`}</select>`;
function timesHTML(){
  const s=sorteio, teams=s.teams||[], adm=true, g=G(); let h="";
  if(sorteioErr) h+=`<div class="card"><div class="empty">⚠️ Falta rodar o <b>supabase-times.sql</b> no Supabase.</div></div>`;
  h+=clkCard();
  if(!teams.length){ h+=adm?setupCard(g):`<div class="card empty">Os times ainda não foram sorteados.</div>`; }
  else{
    const cur=s.cur||[0,1], q=s.queue||[], res=s.reserves||[], n=i=>teams[i]?teams[i].players.length:0;
    h+=`<div class="card"><div class="tag">⚽ Partida atual</div><div class="vs"><div>${pill(cur[0])}<small>${n(cur[0])} jogadores</small></div><b>VS</b><div>${pill(cur[1])}<small>${n(cur[1])} jogadores</small></div></div>
    ${adm?(fin?`<div class="in y" style="margin-top:14px"><b>Quem fica em campo?</b></div><div class="two"><button onclick="finalizar(${cur[0]})">${tm(cur[0]).e} Time ${cur[0]+1} fica</button><button onclick="finalizar(${cur[1]})">${tm(cur[1]).e} Time ${cur[1]+1} fica</button></div><div class="two"><button class="ghost" onclick="finalizar(null)">Ambos saem</button><button class="ghost" onclick="fin=false;render()">Cancelar</button></div>`:`<button style="margin-top:14px" onclick="fin=true;render()">🏁 FINALIZAR PARTIDA</button>`):""}</div>
    <div class="card"><div class="tag">🔄 Próxima partida</div>${q.length?q.map(i=>`<div class="nx">${pill(i)}<small>aguardando · ${n(i)} jogadores</small></div>`).join(""):`<div class="empty" style="padding:6px">Só 2 times: os mesmos voltam a jogar.</div>`}</div>`;
    h+=teams.map((t,i)=>`<div class="card tm" style="animation-delay:${i*.12}s"><div class="head">${pill(i)}<b>${t.players.length}</b></div><ol>${t.players.map((nm,j)=>`<li><em>${j+1}</em><span>${esc(nm)}</span>${adm?mvSel(i,j,teams.length):""}</li>`).join("")}</ol></div>`).join("");
    if(res.length) h+=`<div class="card"><div class="head"><h2>🔄 PRÓXIMOS / RESERVAS</h2><b>${res.length}</b></div><ol>${res.map((nm,j)=>`<li class="w"><em>${j+1}</em><span>${esc(nm)}</span>${adm?mvSel("r",j,teams.length):""}</li>`).join("")}</ol><div class="hint">Esses jogadores entram na próxima partida.</div></div>`;
    if(adm) h+=setupCard(g);
  }
  const hs=s.hist||[];
  if(hs.length) h+=`<div class="card"><div class="tag">🏆 Histórico das partidas</div>${hs.map((x,i)=>`<div class="hi"><span>🏆 PARTIDA ${i+1}</span><span>${tm(x.a).e} Time ${x.a+1} x ${tm(x.b).e} Time ${x.b+1} · ${Math.round(x.dur/6)/10} min · Finalizada</span></div>`).reverse().join("")}</div>`;
  return h;
}

loadHist().then(load); setInterval(()=>{ if(!document.hidden) load() },POLL_MS);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script>
