<title>FUT dos Cria</title>
<style>
:root{--lime:#4ade80;--g:#16a34a;--g2:#15803d;--dk:#0b2a16;--card:rgba(6,32,17,.8);--line:rgba(255,255,255,.14);--tx:#fff;--mut:#a7c9b2;--red:#f87171;--yel:#facc15}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;
background:repeating-linear-gradient(90deg,#166534 0 60px,#14582d 60px 120px)}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 14px calc(50px + env(safe-area-inset-bottom))}
header{text-align:center;padding:calc(26px + env(safe-area-inset-top)) 10px 22px}

.sub{margin:10px 0 0;font-size:.95rem;font-weight:600;color:#d7f5e0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;animation:fadeup .4s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(10px)}}
.hero{background:linear-gradient(160deg,#fff 0,#e8fbee 100%);color:#08170d;border:0;box-shadow:0 10px 30px rgba(0,0,0,.35);position:relative;overflow:hidden}

.info span{width:40px;height:40px;display:grid;place-items:center;background:#0b2a16;border-radius:12px;font-size:1.15rem;flex:none}
.cnt{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;color:#35533f}
.cnt b{font-size:1.6rem;color:#08170d}
.bar{height:14px;background:rgba(0,0,0,.12);border-radius:99px;overflow:hidden;margin:8px 0 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#4ade80,#16a34a);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.badge{margin-top:12px;padding:10px;border-radius:12px;text-align:center;font-weight:900;background:#fef3c7;color:#92400e}
h2{font-size:1.2rem;margin:0 0 12px;font-weight:900}

input::placeholder{color:#8fb59d}

input[type=date],input[type=time]{color-scheme:dark}
button{width:100%;min-height:56px;padding:15px;border:0;border-radius:14px;font-size:1.05rem;font-weight:900;cursor:pointer;color:#04180a;background:var(--lime);letter-spacing:.3px;box-shadow:0 4px 0 #15803d;transition:transform .12s,box-shadow .12s,filter .2s}

@media(hover:hover){button:hover{filter:brightness(1.08)}li:hover{transform:translateX(3px)}}
button.ghost{background:rgba(255,255,255,.1);color:#fff;border:2px solid var(--line);box-shadow:none}
button.danger{background:transparent;color:var(--red);border:2px solid rgba(248,113,113,.4);box-shadow:none}
button.sm{width:auto;min-height:40px;padding:8px 13px;font-size:.85rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.seg button{min-height:52px;font-size:.88rem;padding:8px 4px;background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:2px solid var(--line)}
.seg button.on{background:var(--lime);color:#04180a;border-color:var(--lime)}
.in{background:rgba(74,222,128,.15);border:2px solid var(--lime);border-radius:16px;padding:16px;text-align:center;margin-bottom:4px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.in b{display:block;font-size:1.4rem}
.in span{color:#d7f5e0;font-size:.95rem}
.in.y{background:rgba(250,204,21,.13);border-color:var(--yel)}.in.r{background:rgba(248,113,113,.12);border-color:var(--red)}

.msg{min-height:18px;font-size:.92rem;margin:8px 2px 0;font-weight:800}
.msg.err{color:var(--red)}.msg.good{color:var(--lime)}
.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.head h2{margin:0}.head b{font-size:1.4rem;color:var(--lime)}
ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-weight:800;min-height:50px;animation:pop .35s ease both;transition:transform .15s}
li.me{border-color:var(--lime);background:rgba(74,222,128,.18)}

@keyframes flash{0%{transform:scale(.92);opacity:0;background:rgba(250,204,21,.6)}8%{transform:scale(1.03);opacity:1}100%{background:rgba(255,255,255,.08)}}
li em{font-style:normal;color:#04180a;background:var(--lime);min-width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.82rem;font-weight:900;flex:none}
li.w em{background:var(--yel)}
li span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
li small{color:var(--lime);font-weight:900;letter-spacing:.5px}
.empty{color:var(--mut);text-align:center;padding:14px;font-weight:600}
details{margin-bottom:14px}
summary{list-style:none;cursor:pointer;font-weight:900;font-size:1.1rem;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:20px;min-height:56px}
summary::-webkit-details-marker{display:none}
summary:after{content:"＋";float:right;color:var(--lime)}
details[open] summary:after{content:"－"}
details[open] summary{border-radius:20px 20px 0 0}
details .in2{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 20px 20px;padding:12px 18px;animation:fadeup .3s ease}
.hi{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}
.hi:last-child{border:0}
.foot{text-align:center;margin-top:22px;font-weight:900}
.foot small{display:block;color:var(--mut);font-weight:600;margin-top:4px}
.foot a{color:#6fa583;font-size:.8rem;text-decoration:none;padding:14px;display:inline-block;cursor:pointer;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:.82rem;color:var(--mut);margin:0 0 5px 2px;font-weight:700}
.sec{font-weight:900;color:var(--lime);margin:14px 0 8px;font-size:.9rem}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:9;transform:translate(-50%,-140%);background:#050805;color:#fff;border:2px solid var(--lime);padding:12px 18px;border-radius:99px;font-weight:900;max-width:92vw;transition:transform .35s cubic-bezier(.2,1.2,.4,1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#goal{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
.gscene{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 9vh);display:flex;flex-direction:column;padding:0 5vw;animation:gout 4.9s linear both}
@keyframes gout{0%,90%{opacity:1}100%{opacity:0}}
.ggoal{align-self:flex-end;width:min(38vw,160px);position:relative;animation:gin .4s ease both;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.ggoal svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes gin{from{opacity:0;transform:translate3d(30px,0,0)}}
.gnet{transform-box:fill-box;transform-origin:50% 0;animation:netshake .8s ease-in-out 1.3s both}
@keyframes netshake{0%{transform:none}20%{transform:scale(1.1,1.06) skewX(-7deg)}45%{transform:scale(.95,.97) skewX(6deg)}70%{transform:scale(1.04,1.02) skewX(-3deg)}100%{transform:none}}
.gfl{position:absolute;left:50%;top:60%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid var(--lime);opacity:0;animation:gfl .6s ease-out 1.3s both}
@keyframes gfl{0%{transform:scale(.2);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.gball{position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4));animation:kick 1.35s linear both;will-change:transform}
.gball svg{display:block;width:100%;height:100%}
@media(min-width:520px){.gball{width:38px;height:38px;margin:-19px 0 0 -19px}}
@keyframes kick{
0%{transform:translate3d(-50px,var(--sy,60vh),0) scale(.8) rotate(0);opacity:0;animation-timing-function:ease-out}
6%{opacity:1}
45%{transform:translate3d(calc(var(--gx,70vw)*.5),calc(var(--gy,20vh) - 50px),0) scale(1) rotate(420deg);animation-timing-function:ease-in}
80%{transform:translate3d(calc(var(--gx,70vw)*.88),calc(var(--gy,20vh) - 6px),0) scale(.95) rotate(800deg);animation-timing-function:cubic-bezier(.5,0,1,.6)}
100%{transform:translate3d(var(--gx,70vw),calc(var(--gy,20vh) + 8px),0) scale(.8) rotate(1000deg);opacity:1}}
.gmsg{margin-top:10px;text-align:center;padding:0 10px;animation:gpop .5s cubic-bezier(.2,1.5,.4,1) 1.25s both}
@keyframes gpop{from{opacity:0;transform:scale(.4)}}
.gmsg b{display:block;font-size:clamp(1.6rem,8.5vw,2.6rem);font-weight:900;letter-spacing:-.5px;color:#fff;text-shadow:0 3px 0 #0b2a16,0 0 18px rgba(74,222,128,.7);line-height:1.05;overflow-wrap:anywhere}
.gmsg span{display:inline-block;margin-top:8px;background:#050805;color:var(--lime);border:2px solid var(--lime);padding:6px 14px;border-radius:99px;font-weight:900;font-size:clamp(.9rem,4vw,1.15rem);overflow-wrap:anywhere;max-width:100%}
@media(prefers-reduced-motion:reduce){.gball,.ggoal{display:none}.gscene{top:18vh}}
select{width:100%;padding:14px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.1);color:#fff;font-size:16px;margin-bottom:12px;min-height:52px;outline:none}
option{color:#111}
select.mv{width:auto;max-width:96px;min-height:40px;padding:6px;margin:0;font-size:.85rem}
input[type=checkbox]{width:24px;height:24px;min-height:0;padding:0;margin:0;accent-color:var(--lime);flex:none}
.tabs,.seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tabs button,.seg2 button{min-height:52px;font-size:.92rem;padding:8px 6px;background:rgba(255,255,255,.1);color:#fff;box-shadow:none;border:2px solid var(--line)}
.tabs button.on,.seg2 button.on{background:var(--lime);color:#04180a;border-color:var(--lime)}
.tabs{margin-bottom:14px}
button.big{min-height:64px;font-size:1.25rem}
.clkc{text-align:center;background:linear-gradient(160deg,#050805,#0b2a16)}
.clk{font-size:clamp(3.6rem,21vw,5.6rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-2px}
.clk.running{color:var(--lime)}.clk.paused{color:var(--yel)}.clk.done{color:var(--red);animation:blink 1s step-end infinite}
@keyframes blink{50%{opacity:.35}}
.cls{font-weight:900;margin:8px 0 14px;color:var(--mut)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.vs b{font-size:1.4rem;color:var(--mut)}.vs small,.nx small{display:block;color:var(--mut);font-weight:700;margin-top:6px}
.tpill{display:inline-block;padding:8px 14px;border-radius:99px;font-weight:900;border:2px solid rgba(255,255,255,.35);letter-spacing:.5px}
.nx{display:flex;align-items:center;gap:10px;padding:6px 0}.nx small{margin:0}
.tm .head{margin-bottom:12px}
.cks{display:grid;gap:8px;margin-bottom:12px;max-height:260px;overflow:auto}
.ck{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-weight:800;margin:0;color:#fff;font-size:1rem;min-height:48px}
.hi{flex-wrap:wrap;gap:4px 12px}
#tbar{position:fixed;top:0;left:0;right:0;z-index:7;display:none;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#050805;border-bottom:2px solid var(--lime);font-weight:900;cursor:pointer;font-size:.9rem}
#tbar b{font-size:1.5rem;color:var(--lime);font-variant-numeric:tabular-nums}
body.hasbar header{padding-top:calc(76px + env(safe-area-inset-top))}
#fim,#shuf{position:fixed;inset:0;z-index:8;pointer-events:none;display:grid;place-items:center;padding:20px}
.fimb,.shb{background:rgba(5,8,5,.93);border:3px solid var(--lime);border-radius:22px;padding:22px 26px;text-align:center;max-width:100%;animation:gout 5s linear both}
.shb{animation:pop .3s ease both}
.fimb b,.shb b{display:block;font-size:clamp(1.8rem,9vw,2.8rem);font-weight:900;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.fimb span{display:block;margin-top:8px;color:var(--lime);font-weight:800;font-size:1.1rem}
#shn{display:block;margin-top:10px;font-size:1.6rem;font-weight:900;color:var(--lime);min-height:2rem}
.clk{font-size:clamp(4.6rem,27vw,7.5rem)}
.clkc.running{border-color:var(--lime);box-shadow:0 0 0 2px var(--lime),0 0 34px rgba(74,222,128,.35)}
.clkc.paused{border-color:var(--yel)}.clkc.done{border-color:var(--red);box-shadow:0 0 0 2px var(--red),0 0 34px rgba(239,68,68,.4)}
.clk.running{text-shadow:0 0 26px rgba(74,222,128,.55)}
.clk.low{color:var(--red);text-shadow:0 0 26px rgba(239,68,68,.6);animation:blink 1s step-end infinite}
.cbar{height:10px;background:rgba(255,255,255,.12);border-radius:99px;overflow:hidden;margin:12px 0 0}
.cbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#16a34a);border-radius:99px;transition:width .3s linear}
#fim{display:block;pointer-events:none;padding:0}
.fx{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;overflow:hidden;pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.92);animation:fxin 6.2s linear both,fxflash .5s ease-out}
@keyframes fxin{0%{opacity:0}3%,93%{opacity:1}100%{opacity:0}}
@keyframes fxflash{0%{background:#fff}100%{background:rgba(0,0,0,.92)}}
.fx1{margin:0;font-size:clamp(2.3rem,15vw,5.5rem);line-height:1.05;color:#fff;font-weight:900;overflow-wrap:anywhere;text-shadow:0 0 30px #ef4444,0 0 60px #f97316,0 4px 0 #7f1d1d;animation:slam .6s cubic-bezier(.2,1.6,.4,1) both,shake .3s linear .6s 5}
@keyframes slam{0%{transform:scale(4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translate(0)}25%{transform:translate(-7px,3px) rotate(-1deg)}75%{transform:translate(7px,-3px) rotate(1deg)}}
.fx2{margin:20px 0 0;font-size:clamp(1.6rem,10vw,3.4rem);color:#facc15;font-weight:900;animation:slam .6s cubic-bezier(.2,1.6,.4,1) .35s both,glow .9s ease-in-out .95s infinite alternate}
@keyframes glow{from{text-shadow:0 0 6px #facc15}to{text-shadow:0 0 32px #facc15}}
.fx small{margin-top:28px;color:#8da193;font-weight:700}
.fx i{position:absolute;top:-70px;left:var(--x);font-style:normal;font-size:var(--s,40px);opacity:.85;animation:fall var(--d,3s) linear var(--dl,0s) infinite}
@keyframes fall{to{transform:translate3d(0,120vh,0) rotate(540deg)}}
.tabs{grid-template-columns:repeat(4,1fr);gap:6px}.tabs button{font-size:.7rem;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}.tabs button span{font-size:1.2rem}
#stage{display:none;position:relative;height:clamp(220px,62vw,300px);margin-bottom:14px;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:#0b2a16 radial-gradient(circle at 50% 40%,#14582d,#0b2a16)}#stage canvas{display:block;width:100%;height:100%}.stinfo{position:absolute;left:0;right:0;bottom:0;padding:22px 12px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:.78rem;text-align:center;pointer-events:none}.tin{animation:tabin .45s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 0}@keyframes tabin{from{opacity:0;transform:perspective(900px) rotateX(10deg) translateY(16px)}}

<script>
// ================== CONFIG ==================
const SUPA_URL = "https://utoougnrgsnmeneemgtg.supabase.co/rest/v1";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV0b291Z25yZ3NubWVuZWVtZ3RnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEyMjEzMjcsImV4cCI6MjEwNjc5NzMyN30.aM0_6_6Grm8cDYVH4xfXkKzDdlqyNtIvr7If2X5dRiw";

const ICO={home:'<path d="M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6"/>',list:'<path d="M9 4h6v3H9zM7 5H6a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1M9 12h6M9 16h6"/>',users:'<path d="M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM22 20v-2a4 4 0 0 0-3-3.9M16 2.1a4 4 0 0 1 0 7.8"/>',wallet:'<path d="M3 7a2 2 0 0 1 2-2h13v4M3 7v11a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2zM16 14h2"/>',cal:'<path d="M8 2v4M16 2v4M3 9h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',pin:'<path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>',key:'<path d="M21 2l-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.8 7.8 5.5 5.5 0 0 1 7.8-7.8zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3"/>',refresh:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8M21 3v5h-5"/>',drop:'<path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/>',wind:'<path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2M9.6 4.6A2 2 0 1 1 11 8H2M12.6 19.4A2 2 0 1 0 14 16H2"/>',temp:'<path d="M14 4v10.54a4 4 0 1 1-4 0V4a2 2 0 0 1 4 0z"/>'};

function wxIco(code,night){
  const CL=(y=0)=>`<path transform="translate(0 ${y})" d="M14 30h20a7 7 0 0 0 .7-13.97A10 10 0 0 0 13.6 18 6 6 0 0 0 14 30z" fill="rgba(203,213,225,.2)" stroke="#cbd5e1"/>`;
  const SUN='<circle cx="24" cy="24" r="8" fill="#facc15" stroke="#facc15"/><path stroke="#facc15" d="M24 6v5M24 37v5M6 24h5M37 24h5M36.7 11.3l-3.5 3.5M14.8 33.2l-3.5 3.5M36.7 36.7l-3.5-3.5M14.8 14.8l-3.5-3.5"/>';
  let b;
  if(code===0||code===1) b=night?'<path d="M30 8a16 16 0 1 0 10 28A13 13 0 0 1 30 8z" fill="#e2e8f0" stroke="#e2e8f0"/>':SUN;
  else if(code===2) b='<circle cx="17" cy="17" r="6" fill="#facc15" stroke="#facc15"/><path stroke="#facc15" d="M17 5v3M5 17h3M8.5 8.5l2 2M25.5 8.5l-2 2"/><path d="M16 40h18a7 7 0 0 0 .7-13.97A10 10 0 0 0 15.6 28 6 6 0 0 0 16 40z" fill="#1c3a28" stroke="#cbd5e1"/>';
  else if(code===3) b=CL(4);
  else if(code===45||code===48) b=CL(0)+'<path stroke="#94a3b8" d="M12 36h24M16 41h16"/>';
  else if(code>=95) b=CL(0)+'<path d="M25 30l-5 9h5l-2 7 8-11h-5l3-5z" fill="#facc15" stroke="#facc15"/>';
  else if((code>=71&&code<=77)||code===85||code===86) b=CL(0)+'<g fill="#e2e8f0" stroke="none"><circle cx="17" cy="37" r="1.8"/><circle cx="25" cy="41" r="1.8"/><circle cx="33" cy="37" r="1.8"/></g>';
  else if((code>=51&&code<=67)||(code>=80&&code<=82)) b=CL(0)+'<path stroke="#7dd3fc" d="M18 35l-2 7M26 35l-2 7M34 35l-2 7"/>';
  else b=CL(4);
  return `<svg class="wi" viewBox="0 0 48 48" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="${esc(WMO[code]||"Clima")}">${b}</svg>`;
}
let device = localStorage.getItem("fdc_device");
if(!device){device = (crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());localStorage.setItem("fdc_device",device)}
let isAdmin=false, adminOpen=false, match=null, players=[], hist=[], msg={t:"",c:""}, editing=false, known=null, fresh={}, lastSig="";


async function api(path, opt={}){
  const r = await fetch(SUPA_URL+path,{headers:{...H,...(opt.prefer?{Prefer:opt.prefer}:{})},method:opt.method||"GET",body:opt.body?JSON.stringify(opt.body):undefined});
  const txt = await r.text(); let data; try{data = txt?JSON.parse(txt):null}catch{data = txt}
  if(!r.ok) throw {status:r.status,data};
  return data;
}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),3200)}
const G = () => ({vou:players.filter(p=>p.status==="vou"),talvez:players.filter(p=>p.status==="talvez"),nao:players.filter(p=>p.status==="nao"),espera:players.filter(p=>p.status==="espera")});

async function load(){
  try{
    const m = await api("/matches?active=eq.true&order=id.desc&limit=1");
    match = m[0]||null;
    players = match ? await api(`/players?match_id=eq.${match.id}&order=created_at.asc,id.asc`) : [];
    if(match && !busyW){ try{ const r=await api(`/sorteio?match_id=eq.${match.id}`); const ns=r[0]?r[0].state:{}; lock=r[0]&&r[0].lock_until?{by:r[0].lock_by,until:Date.parse(r[0].lock_until)}:{by:null,until:0};
      if(seenV!==null&&ns.v&&ns.v!==seenV&&ns.teams) toast("⚽ TIMES DEFINIDOS!");
      seenV=ns.v||0; sorteio=ns; sorteioErr=false }catch{ sorteioErr=true } }
    syncClock();
    const vouNow = players.filter(p=>p.status==="vou");
    if(known){ const nw=vouNow.filter(p=>!known.has(p.id)&&p.device_id!==device);
      if(nw.length){ toast("🔥 Novo jogador confirmado!"); nw.forEach(p=>{fresh[p.id]=Date.now()+6000;goal(p.name)}); setTimeout(()=>{if(!editing)render()},6100) } }
    known = new Set(vouNow.map(p=>p.id));
    if(msg.c==="err"&&msg.t.startsWith("Sem conexão")) msg={t:"",c:""};
  }catch(e){ msg = {t:"Sem conexão com o banco. Verifique o setup.",c:"err"}; lastSig="" }
  const sig = JSON.stringify([match,players,msg,Object.keys(fresh).length,sorteio,sorteioErr,isAdmin,lockedOther()]);
  if(!editing && sig!==lastSig){ lastSig=sig; render(); }
}
async function loadHist(){
  try{
    const ms = await api("/matches?active=eq.false&order=id.desc&limit=8");
    if(!ms.length){hist=[];return}
    const ps = await api(`/players?select=match_id&status=eq.vou&match_id=in.(${ms.map(m=>m.id).join(",")})`);
    hist = ms.map(m=>({date:m.date,n:ps.filter(p=>p.match_id===m.id).length}));
  }catch{}
}

function render(){
  document.body.dataset.tab=tab;
  const app=$("#app");
  if(adminOpen && isAdmin){ app.innerHTML=adminHTML(); return; }
  if(adminOpen){ app.innerHTML=loginHTML(); return; }
  if(tab==="inicio"){ app.innerHTML=tabsHTML()+inicioHTML(); return; }

  if(tab==="times"){ app.innerHTML=tabsHTML()+timesHTML(); return; }
  const g=G(), n=g.vou.length, max=match.max_players, full=n>=max, pct=Math.min(100,Math.round(n/max*100));
  const mine=players.find(p=>p.device_id===device), st=mine&&mine.status;
  const keepName=$("#nome")?$("#nome").value:"";
  const pos = mine&&st==="espera" ? g.espera.indexOf(mine)+1 : 0;
  let action;
  if(mine){

function playGol(){
  if(!soundOn||!actx||actx.state!=="running") return;
  try{
    const t=actx.currentTime, len=actx.sampleRate*1.6, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=actx.createBufferSource(); src.buffer=buf;
    const f=actx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=900; f.Q.value=.7;
    const g=actx.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.22,t+.35); g.gain.linearRampToValueAtTime(0,t+1.6);
    src.connect(f); f.connect(g); g.connect(actx.destination); src.start(t);
    const o=actx.createOscillator(), og=actx.createGain(); o.type="square";
    o.frequency.setValueAtTime(520,t+.05); o.frequency.linearRampToValueAtTime(700,t+.4);
    og.gain.setValueAtTime(.05,t+.05); og.gain.linearRampToValueAtTime(0,t+.5);

  }catch{}
}

  [[-40,-30],[40,-30],[-46,22],[46,22]].forEach(([x,z])=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.35,.5,20,8),sm[0]);p.position.set(x,10,z);const l=new THREE.Mesh(new THREE.BoxGeometry(5,2.6,.6),lm);l.position.set(x,20.5,z);l.lookAt(0,5,0);sc.add(p,l)});
  // placar 3D com dados reais
  const bc=document.createElement("canvas"); bc.width=512; bc.height=200; const bt=new THREE.CanvasTexture(bc);
  const board=new THREE.Mesh(new THREE.BoxGeometry(18,7,.6),[0,0,0,0,new THREE.MeshBasicMaterial({map:bt}),new THREE.MeshStandardMaterial({color:0x111111})].map(m=>m||new THREE.MeshStandardMaterial({color:0x111111}))); board.position.set(0,12.5,-33); sc.add(board);
  const post=new THREE.Mesh(new THREE.BoxGeometry(1,5,1),sm[0]); post.position.set(0,8,-33.4); sc.add(post);
  function drawBoard(){const x=bc.getContext("2d"); x.fillStyle="#050805"; x.fillRect(0,0,512,200); x.textAlign="center"; x.fillStyle="#4ade80"; x.font="900 50px system-ui,sans-serif"; x.fillText("FUT DOS CRIA",256,58); x.fillStyle="#fff"; x.font="700 28px system-ui,sans-serif";

  // bola
  const ball=new THREE.Mesh(new THREE.SphereGeometry(.45,16,12),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5})); ball.castShadow=true; sc.add(ball);
  // sol, nuvens, estrelas
  const gc=document.createElement("canvas"); gc.width=gc.height=64; const gg=gc.getContext("2d").createRadialGradient(32,32,2,32,32,32); gg.addColorStop(0,"rgba(255,240,170,1)"); gg.addColorStop(1,"rgba(255,220,120,0)"); gc.getContext("2d").fillStyle=gg; gc.getContext("2d").fillRect(0,0,64,64);
  const glow=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(gc),blending:THREE.AdditiveBlending,transparent:true,depthWrite:false,fog:false})); glow.scale.set(40,40,1); glow.position.set(-35,28,-70);
  const sunB=new THREE.Mesh(new THREE.SphereGeometry(3,16,12),new THREE.MeshBasicMaterial({color:0xffe27a,fog:false})); sunB.position.copy(glow.position); sc.add(glow,sunB);
  const cmat=new THREE.MeshLambertMaterial({color:0xffffff,transparent:true,opacity:.92}), clouds=[];
  for(let i=0;i<8;i++){const o=new THREE.Group(); for(let j=0;j<5;j++){const s=new THREE.Mesh(new THREE.SphereGeometry(3+Math.random()*2.5,10,8),cmat); s.position.set(j*3.4-7,Math.random()*1.6,Math.random()*3); o.add(s)} o.position.set(-60+i*17,22+Math.random()*8,-45+Math.random()*50); o.userData.v=.5+Math.random()*.7; sc.add(o); clouds.push(o)}
  const sp=new Float32Array(600); for(let i=0;i<200;i++){const a=Math.random()*6.28,b=.15+Math.random()*1.2,r=130; sp[i*3]=Math.cos(a)*Math.cos(b)*r; sp[i*3+1]=Math.sin(b)*r*.6+15; sp[i*3+2]=-Math.abs(Math.sin(a)*Math.cos(b)*r)-20}
  const sg=new THREE.BufferGeometry(); sg.setAttribute("position",new THREE.BufferAttribute(sp,3)); const stars=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.2,transparent:true,opacity:0,fog:false})); sc.add(stars);
  // chuva 3D (linhas com profundidade)
  const RMAX=low?500:1300, P=new Float32Array(RMAX*6), rg=new THREE.BufferGeometry(); for(let i=0;i<RMAX;i++){const o=i*6; P[o]=(Math.random()-.5)*90; P[o+1]=Math.random()*30; P[o+2]=(Math.random()-.5)*80; P[o+3]=P[o]; P[o+4]=P[o+1]+1; P[o+5]=P[o+2]}
  rg.setAttribute("position",new THREE.BufferAttribute(P,3)); const rain=new THREE.LineSegments(rg,new THREE.LineBasicMaterial({color:0xb8cdf5,transparent:true,opacity:.55})); rain.frustumCulled=false; sc.add(rain);
  // explosão de partículas (confirmação / jogo lotado)
  const BN=140, BP=new Float32Array(BN*3), BV=new Float32Array(BN*3), bg=new THREE.BufferGeometry(); bg.setAttribute("position",new THREE.BufferAttribute(BP,3));
  const burst=new THREE.Points(bg,new THREE.PointsMaterial({color:0x4ade80,size:.7,transparent:true,opacity:1})); burst.visible=false; burst.frustumCulled=false; sc.add(burst); let bt0=0;
  S3.burst=()=>{for(let i=0;i<BN;i++){BP[i*3]=0;BP[i*3+1]=2;BP[i*3+2]=0;BV[i*3]=(Math.random()-.5)*14;BV[i*3+1]=6+Math.random()*10;BV[i*3+2]=(Math.random()-.5)*14} bt0=2.4; burst.visible=true; S3.kick()};
  // estado visual alvo (derivado dos dados reais) e estado atual
  const cur={hemi:.6,sun:.5,spot:0,cl:.15,rain:0,stars:0,sunv:0,dark:0,wind:3}, sky=C(0x5d7078); let T={...cur,sky:C(0x5d7078)}, flash=0, nextL=5, lastSig="";
  S3.sync=()=>{
    const w=s3Weather(), n=match?G().vou.length:0, sig=JSON.stringify([match&&[match.id,match.date,match.time,match.location,match.max_players],n,w.txt,w.k&&[w.rain,w.cl,w.night,w.storm]]);
    const full=!!match&&n>=match.max_players; if(S3.fm===(match&&match.id)&&S3.full===false&&full) S3.burst(); S3.fm=match&&match.id; S3.full=full;
    if(sig===lastSig) return; lastSig=sig; drawBoard(); $("#stinfo").innerHTML=`<b>${esc(w.txt)}</b>`;
    if(!w.k) T={...cur,hemi:.6,sun:.5,spot:0,cl:.15,rain:0,stars:0,sunv:0,dark:0,wind:3,sky:C(0x5d7078),storm:false};
    else if(w.night) T={hemi:.25,sun:.05,spot:1.6,cl:w.cl*.8,rain:w.rain,stars:1-w.cl*.8,sunv:0,dark:w.rain?.6:0,wind:w.wind,sky:C(w.storm?0x0a0d14:0x060a14),storm:w.storm};
    else if(w.storm) T={hemi:.3,sun:.25,spot:.8,cl:1,rain:w.rain,stars:0,sunv:0,dark:1,wind:w.wind,sky:C(0x2c333d),storm:true};
    else T={hemi:.85-.45*w.cl,sun:.95-.8*w.cl,spot:w.rain?.4:0,cl:w.cl,rain:w.rain,stars:0,sunv:w.sunny?1:0,dark:w.rain?.55:w.cl*.25,wind:w.wind,sky:C(0x87b8e8).lerp(C(0x7f8996),w.cl).multiplyScalar(w.rain?.7:1),storm:false};
    S3.kick();
  };
  const size=()=>{const w=el.clientWidth||320,h=el.clientHeight||200; R.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix()};
  size(); addEventListener("resize",size);
  el.addEventListener("pointermove",e=>{const r=el.getBoundingClientRect(); S3.px=(e.clientX-r.left)/r.width*2-1; S3.py=(e.clientY-r.top)/r.height*2-1},{passive:true});
  const white=C(0xffffff), gray=C(0x4b5160);
  function step(dt,t){
    const a=1-Math.exp(-dt*1.6); for(const k in cur) cur[k]+=(T[k]-cur[k])*a; sky.lerp(T.sky,a);
    flash=Math.max(0,flash-dt*3); if(T.storm){nextL-=dt; if(nextL<0){flash=1; nextL=4+Math.random()*7}}
    sc.background.copy(sky); sc.fog.color.copy(sky); hemi.intensity=cur.hemi+flash*1.4; sun.intensity=cur.sun; spots.forEach(s=>s.intensity=cur.spot);
    stars.material.opacity=cur.stars; stars.visible=cur.stars>.03; glow.material.opacity=cur.sunv; glow.visible=sunB.visible=cur.sunv>.03;
    cmat.color.copy(white).lerp(gray,cur.dark); const nc=Math.round(cur.cl*8); clouds.forEach((c,i)=>{c.visible=i<nc; c.position.x+=dt*c.userData.v; if(c.position.x>75)c.position.x=-75});
    const n=Math.floor(cur.rain*RMAX*(S3.down?.5:1)); rg.setDrawRange(0,n*2); rain.visible=n>0;
    if(n>0){const v=26+cur.rain*20, dr=Math.min(12,cur.wind/4)+1; for(let i=0;i<n;i++){const o=i*6; let y=P[o+1]-v*dt; if(y<0){y=28+Math.random()*6;P[o]=(Math.random()-.5)*90;P[o+2]=(Math.random()-.5)*80} P[o]+=dr*dt; P[o+1]=y; P[o+3]=P[o]-dr*.05; P[o+4]=y+1; P[o+5]=P[o+2]} rg.attributes.position.needsUpdate=true}
    ball.position.set(Math.cos(t*.5)*12,.45+Math.abs(Math.sin(t*2.6))*.7,Math.sin(t*.7)*7); ball.rotation.x=t*3; ball.rotation.z=t*2;
    if(bt0>0){bt0-=dt; for(let i=0;i<BN;i++){BV[i*3+1]-=18*dt; BP[i*3]+=BV[i*3]*dt; BP[i*3+1]=Math.max(0,BP[i*3+1]+BV[i*3+1]*dt); BP[i*3+2]+=BV[i*3+2]*dt} bg.attributes.position.needsUpdate=true; burst.material.opacity=Math.min(1,bt0); if(bt0<=0) burst.visible=false}

  }

    step(dt,(now-t0)/1000); R.render(sc,cam); S3.raf=requestAnimationFrame(loop) }

}
